[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "magnon-cnot"
version = "2.0.0"
description = "Reduced-model and MuMax3 validation of conditional Josephson coupling toward classical magnon-BEC logic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Bao-Duy Le", email = "24130012@student.hcmus.edu.vn"},
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]

[project.urls]
Repository = "https://github.com/Duyle0503/magnon-cnot"

[tool.setuptools]
packages = ["magnon_cnot"]
